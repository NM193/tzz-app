<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <b>Tzz</b><span>Collector</span>
  </header>

  <p id="where" class="note"></p>

  <div class="actions">
    <button id="course" class="cta">Collect the course</button>
    <button id="lesson" class="ghost">Just this lesson</button>
  </div>

  <p id="status" class="note"></p>
  <p id="error" class="note note--loud"></p>
  <ol id="list"></ol>

  <div class="actions actions--end">
    <button id="clear" class="ghost">Clear</button>
    <button id="copy" class="cta" disabled>Copy all</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
